# Deploys the site to GitHub Pages exactly as committed.
# Paused 2026-10-15: no release lookup, no version stamping, no appcast copy.
# glance/appcast.xml is a committed, empty Sparkle feed so installed copies get no updates.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Drop repo-only files from the published site
        run: rm -rf .github README.md LICENSE NOTICE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
